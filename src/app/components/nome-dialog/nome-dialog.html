<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [header]="header()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '28rem' }"
  [closable]="!saving()"
  [closeOnEscape]="!saving()"
>
  <form class="nome-dialog__form" (ngSubmit)="submit()">
    <label class="nome-dialog__label" for="nome-dialog-input">{{ label() }}</label>
    <input
      id="nome-dialog-input"
      pInputText
      class="nome-dialog__input"
      name="nome"
      autocomplete="off"
      [ngModel]="nome()"
      (ngModelChange)="nome.set($event)"
      [placeholder]="placeholder()"
      [maxlength]="maxLength()"
      [disabled]="saving()"
    />
  </form>

  <ng-template #footer>
    <div class="nome-dialog__actions">
      <p-button
        label="Annulla"
        severity="secondary"
        [text]="true"
        [disabled]="saving()"
        (onClick)="visible.set(false)"
      />
      <p-button
        label="Salva"
        icon="pi pi-check"
        [loading]="saving()"
        [disabled]="nome().trim().length === 0"
        (onClick)="submit()"
      />
    </div>
  </ng-template>
</p-dialog>
