<p-dialog
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [header]="header()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '32rem' }"
  [closable]="!saving()"
  [closeOnEscape]="!saving()"
>
  <form class="autore-dialog__form" (ngSubmit)="submit()">
    <div class="autore-dialog__field">
      <label for="autore-nome">Nome</label>
      <input
        id="autore-nome"
        pInputText
        name="nome"
        autocomplete="off"
        maxlength="100"
        [ngModel]="nome()"
        (ngModelChange)="nome.set($event)"
        [disabled]="saving()"
      />
    </div>

    <div class="autore-dialog__field">
      <label for="autore-cognome">Cognome</label>
      <input
        id="autore-cognome"
        pInputText
        name="cognome"
        autocomplete="off"
        maxlength="100"
        [ngModel]="cognome()"
        (ngModelChange)="cognome.set($event)"
        [disabled]="saving()"
      />
    </div>

    <div class="autore-dialog__field">
      <label for="autore-data-nascita">Data di nascita</label>
      <p-datepicker
        inputId="autore-data-nascita"
        name="dataNascita"
        dateFormat="dd/mm/yy"
        [showIcon]="true"
        [maxDate]="today"
        [ngModel]="dataNascita()"
        (ngModelChange)="dataNascita.set($event)"
        [disabled]="saving()"
        appendTo="body"
      />
    </div>

    <div class="autore-dialog__field">
      <label for="autore-nazionalita">Nazionalità</label>
      <div class="autore-dialog__row">
        <p-select
          inputId="autore-nazionalita"
          name="idNazionalita"
          placeholder="Seleziona una nazionalità"
          [options]="opzioniNazionalita()"
          optionLabel="nome"
          optionValue="id"
          [filter]="true"
          [ngModel]="idNazionalita()"
          (ngModelChange)="idNazionalita.set($event)"
          [disabled]="saving()"
          appendTo="body"
        />
        <p-button
          icon="pi pi-plus"
          severity="secondary"
          [outlined]="true"
          [disabled]="saving()"
          ariaLabel="Crea una nuova nazionalità"
          (onClick)="apriNuovaNazionalita()"
        />
      </div>
    </div>
  </form>

  <ng-template #footer>
    <div class="autore-dialog__actions">
      <p-button
        label="Annulla"
        severity="secondary"
        [text]="true"
        [disabled]="saving()"
        (onClick)="visible.set(false)"
      />
      <p-button
        label="Salva"
        icon="pi pi-check"
        [loading]="saving()"
        [disabled]="!valid()"
        (onClick)="submit()"
      />
    </div>
  </ng-template>
</p-dialog>

<app-nome-dialog
  [visible]="creandoNazionalita()"
  (visibleChange)="creandoNazionalita.set($event)"
  header="Nuova nazionalità"
  label="Nome della nazionalità"
  placeholder="es. Portogallo"
  [saving]="salvandoNazionalita()"
  (save)="creaNazionalita($event)"
/>
