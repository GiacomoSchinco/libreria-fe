<header class="topbar">
  <div class="topbar__start">
    @if (showMenu()) {
      <button
        type="button"
        class="icon-button topbar__menu"
        aria-label="Apri il menu"
        (click)="toggleMenu()"
      >
        <i class="pi pi-bars" aria-hidden="true"></i>
      </button>
    }

    <app-brand />
  </div>

  <div class="topbar__end">
    <button
      type="button"
      class="icon-button"
      aria-label="Attiva o disattiva il tema scuro"
      title="Tema chiaro/scuro"
      (click)="theme.toggle()"
    >
      <i class="pi pi-moon theme-icon theme-icon--light" aria-hidden="true"></i>
      <i class="pi pi-sun theme-icon theme-icon--dark" aria-hidden="true"></i>
    </button>

    @if (showSession()) {
      @if (profileError(); as message) {
        <span class="session__error" role="alert">{{ message }}</span>
      } @else if (username(); as name) {
        <span class="session" [title]="name">
          <span class="session__avatar" aria-hidden="true">{{ initials() }}</span>
          <span class="session__name">{{ name }}</span>
        </span>
      }

      <button type="button" class="topbar__logout" (click)="logout()">
        <i class="pi pi-sign-out" aria-hidden="true"></i>
        <span class="topbar__logout-label">Esci</span>
      </button>
    } @else {
      <a pButton label="Accedi" icon="pi pi-sign-in" size="small" routerLink="/login"></a>
    }
  </div>
</header>
