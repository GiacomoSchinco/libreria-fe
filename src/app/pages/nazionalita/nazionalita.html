<section class="page">
  <header class="page__header">
    <div>
      <h1>Nazionalità</h1>
      <p>Tutte le nazionalità registrate.</p>
    </div>
    <p-button label="Nuova nazionalità" icon="pi pi-plus" (onClick)="openCreate()" />
  </header>
  @if (nazionalita.error()) {
    <p class="error">Errore nel caricamento delle Nazionalità.</p>
  }
  @if (nazionalita.value()) {
    <p-table
      [value]="nazionalita.value() ?? []"
      [loading]="nazionalita.isLoading()"
      dataKey="id"
      [tableStyle]="{ 'min-width': '26rem' }"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Nome</th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-nazionalita>
        <tr>
          <td>{{ nazionalita.nome }}</td>
          <td>
            <div class="row-actions">
              <p-button
                icon="pi pi-pencil"
                severity="secondary"
                [text]="true"
                [rounded]="true"
                [ariaLabel]="'Modifica ' + nazionalita.nome"
                (onClick)="openEdit(nazionalita)"
              />
              <p-button
                icon="pi pi-trash"
                severity="danger"
                [text]="true"
                [rounded]="true"
                [loading]="deleting() === nazionalita.id"
                [ariaLabel]="'Elimina ' + nazionalita.nome"
                (onClick)="delete(nazionalita)"
              />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="2">Nessuna nazionalità trovata.</td>
        </tr>
      </ng-template>
    </p-table>
  }

  <app-nome-dialog
    [visible]="dialogVisible()"
    (visibleChange)="onDialogVisibleChange($event)"
    [header]="editing() ? 'Modifica nazionalità' : 'Nuova nazionalità'"
    label="Nome della nazionalità"
    placeholder="es. Portogallo"
    [value]="editing()?.nome ?? ''"
    [saving]="saving()"
    (save)="save($event)"
  />
</section>
