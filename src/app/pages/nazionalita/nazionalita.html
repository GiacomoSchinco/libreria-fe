<section class="page">
  <app-page-header title="Nazionalità" [subtitle]="subtitle()" icon="pi pi-globe">
    <p-button label="Nuova nazionalità" icon="pi pi-plus" (onClick)="openCreate()" />
  </app-page-header>

  @if (nazionalita.error()) {
    <p class="inline-error">
      <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
      <span>Errore nel caricamento delle nazionalità.</span>
      <p-button label="Riprova" size="small" [text]="true" (onClick)="nazionalita.reload()" />
    </p>
  }

  <div class="card table-card">
    <div class="table-scroll">
      <p-table
        [value]="nazionalita.value() ?? []"
        [loading]="nazionalita.isLoading()"
        dataKey="id"
        [tableStyle]="{ 'min-width': '22rem' }"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>Nazionalità</th>
            <th aria-label="Azioni"></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-nazione>
          <tr>
            <td>
              <div class="named">
                <span class="named__icon" aria-hidden="true"><i class="pi pi-globe"></i></span>
                <span class="cell-title">{{ nazione.nome }}</span>
              </div>
            </td>
            <td class="cell-action">
              <div class="row-actions">
                <p-button
                  icon="pi pi-pencil"
                  severity="secondary"
                  [text]="true"
                  [rounded]="true"
                  pTooltip="Modifica"
                  [ariaLabel]="'Modifica ' + nazione.nome"
                  (onClick)="openEdit(nazione)"
                />
                <p-button
                  icon="pi pi-trash"
                  severity="danger"
                  [text]="true"
                  [rounded]="true"
                  pTooltip="Elimina"
                  [loading]="deleting() === nazione.id"
                  [ariaLabel]="'Elimina ' + nazione.nome"
                  (onClick)="delete(nazione)"
                />
              </div>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="2">
              @if (!nazionalita.isLoading()) {
                <app-empty-state
                  icon="pi pi-globe"
                  title="Nessuna nazionalità"
                  message="Le nazionalità servono ad anagrafica degli autori."
                />
              }
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>

  <app-nome-dialog
    [visible]="dialogVisible()"
    (visibleChange)="onDialogVisibleChange($event)"
    [header]="editing() ? 'Modifica nazionalità' : 'Nuova nazionalità'"
    label="Nome della nazionalità"
    placeholder="es. Portogallo"
    [value]="editing()?.nome ?? ''"
    [saving]="saving()"
    (save)="save($event)"
  />
</section>
