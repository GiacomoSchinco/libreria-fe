<section class="page">
  <header class="page__header">
    <h1>Libri</h1>
    <p>Tutti i volumi del catalogo.</p>
  </header>
  @if (magazzino.error()) {
    <p class="error">Errore nel caricamento dei Magazzino.</p>
  }

  <p-table
    [value]="magazzino.value()?.content ?? []"
    [lazy]="true"
    [paginator]="true"
    [rows]="pageSize()"
    [first]="pageIndex() * pageSize()"
    [totalRecords]="magazzino.value()?.page?.totalElements ?? 0"
    [loading]="magazzino.isLoading()"
    dataKey="id"
    [tableStyle]="{ 'min-width': '44rem' }"
    (onPage)="onPage($event)"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Titolo</th>
        <th>Casa Editrice</th>
        <th>Quantità</th>
        <th>Anno</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-magazzino>
      <tr>
        <td>{{ magazzino.libro.titolo }}</td>
        <td>{{ magazzino.casaEditrice.nome }}</td>
        <td>{{ magazzino.quantita }}</td>
        <td>{{ magazzino.libro.anno }}</td>
        <th></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5">Nessun libro trovato.</td>
      </tr>
    </ng-template>
  </p-table>
</section>
