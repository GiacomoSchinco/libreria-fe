<section class="page">
  <header class="page__header">
    <div>
      <h1>Generi</h1>
      <p>Tutti i generi registrati.</p>
    </div>
    <p-button label="Nuovo genere" icon="pi pi-plus" (onClick)="openCreate()" />
  </header>
  @if (generi.error()) {
    <p class="error">Errore nel caricamento dei Generi.</p>
  }
  @if (generi.value()) {
    <p-table
      [value]="generi.value() ?? []"
      [loading]="generi.isLoading()"
      dataKey="id"
      [tableStyle]="{ 'min-width': '26rem' }"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Nome</th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-genere>
        <tr>
          <td>{{ genere.nome }}</td>
          <td>
            <div class="row-actions">
              <p-button
                icon="pi pi-pencil"
                severity="secondary"
                [text]="true"
                [rounded]="true"
                [ariaLabel]="'Modifica ' + genere.nome"
                (onClick)="openEdit(genere)"
              />
              <p-button
                icon="pi pi-trash"
                severity="danger"
                [text]="true"
                [rounded]="true"
                [loading]="deleting() === genere.id"
                [ariaLabel]="'Elimina ' + genere.nome"
                (onClick)="delete(genere)"
              />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="2">Nessun genere trovato.</td>
        </tr>
      </ng-template>
    </p-table>
  }

  <app-nome-dialog
    [visible]="dialogVisible()"
    (visibleChange)="onDialogVisibleChange($event)"
    [header]="editing() ? 'Modifica genere' : 'Nuovo genere'"
    label="Nome del genere"
    placeholder="es. Romanzo Storico"
    [value]="editing()?.nome ?? ''"
    [saving]="saving()"
    (save)="save($event)"
  />
</section>
