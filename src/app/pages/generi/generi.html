<section class="page">
  <app-page-header title="Generi" [subtitle]="subtitle()" icon="pi pi-tags">
    <p-button label="Nuovo genere" icon="pi pi-plus" (onClick)="openCreate()" />
  </app-page-header>

  @if (generi.error()) {
    <p class="inline-error">
      <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
      <span>Errore nel caricamento dei generi.</span>
      <p-button label="Riprova" size="small" [text]="true" (onClick)="generi.reload()" />
    </p>
  }

  <div class="card table-card">
    <div class="table-scroll">
      <p-table
        [value]="generi.value() ?? []"
        [loading]="generi.isLoading()"
        dataKey="id"
        [tableStyle]="{ 'min-width': '22rem' }"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>Genere</th>
            <th aria-label="Azioni"></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-genere>
          <tr>
            <td>
              <div class="named">
                <span class="named__icon" aria-hidden="true"><i class="pi pi-tag"></i></span>
                <span class="cell-title">{{ genere.nome }}</span>
              </div>
            </td>
            <td class="cell-action">
              <div class="row-actions">
                <p-button
                  icon="pi pi-pencil"
                  severity="secondary"
                  [text]="true"
                  [rounded]="true"
                  pTooltip="Modifica"
                  [ariaLabel]="'Modifica ' + genere.nome"
                  (onClick)="openEdit(genere)"
                />
                <p-button
                  icon="pi pi-trash"
                  severity="danger"
                  [text]="true"
                  [rounded]="true"
                  pTooltip="Elimina"
                  [loading]="deleting() === genere.id"
                  [ariaLabel]="'Elimina ' + genere.nome"
                  (onClick)="delete(genere)"
                />
              </div>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="2">
              @if (!generi.isLoading()) {
                <app-empty-state
                  icon="pi pi-tags"
                  title="Nessun genere"
                  message="Crea i generi per classificare i libri del catalogo."
                />
              }
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>

  <app-nome-dialog
    [visible]="dialogVisible()"
    (visibleChange)="onDialogVisibleChange($event)"
    [header]="editing() ? 'Modifica genere' : 'Nuovo genere'"
    label="Nome del genere"
    placeholder="es. Romanzo Storico"
    [value]="editing()?.nome ?? ''"
    [saving]="saving()"
    (save)="save($event)"
  />
</section>
