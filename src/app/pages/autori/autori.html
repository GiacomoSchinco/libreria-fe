<section class="page">
  <app-page-header title="Autori" [subtitle]="subtitle()" icon="pi pi-users">
    <p-button label="Nuovo autore" icon="pi pi-plus" (onClick)="openCreate()" />
  </app-page-header>

  @if (autori.error()) {
    <p class="inline-error">
      <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
      <span>Errore nel caricamento degli autori.</span>
      <p-button label="Riprova" size="small" [text]="true" (onClick)="autori.reload()" />
    </p>
  }

  <div class="card table-card">
    <div class="table-scroll">
      <p-table
        [value]="autori.value()?.content ?? []"
        [lazy]="true"
        [paginator]="true"
        [rows]="pageSize()"
        [first]="pageIndex() * pageSize()"
        [totalRecords]="autori.value()?.page?.totalElements ?? 0"
        [rowsPerPageOptions]="[10, 20, 50]"
        [loading]="autori.isLoading()"
        dataKey="id"
        [tableStyle]="{ 'min-width': '38rem' }"
        (onPage)="onPage($event)"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>Autore</th>
            <th>Nazionalità</th>
            <th>Data di nascita</th>
            <th aria-label="Azioni"></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-autore>
          <tr>
            <td>
              <div class="person">
                <span class="person__avatar" aria-hidden="true">{{ initial(autore.nome) }}</span>
                <span class="cell-title">{{ autore.nome }} {{ autore.cognome }}</span>
              </div>
            </td>
            <td>{{ autore.nazionalita.nome }}</td>
            <td>{{ autore.dataNascita | date: 'dd/MM/yyyy' }}</td>
            <td class="cell-action">
              <div class="row-actions">
                <p-button
                  icon="pi pi-pencil"
                  severity="secondary"
                  [text]="true"
                  [rounded]="true"
                  pTooltip="Modifica"
                  [ariaLabel]="'Modifica ' + autore.nome + ' ' + autore.cognome"
                  (onClick)="openEdit(autore)"
                />
                <p-button
                  icon="pi pi-trash"
                  severity="danger"
                  [text]="true"
                  [rounded]="true"
                  pTooltip="Elimina"
                  [loading]="deleting() === autore.id"
                  [ariaLabel]="'Elimina ' + autore.nome + ' ' + autore.cognome"
                  (onClick)="delete(autore)"
                />
              </div>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4">
              @if (!autori.isLoading()) {
                <app-empty-state
                  icon="pi pi-users"
                  title="Nessun autore"
                  message="Registra i tuoi autori per collegarli ai libri del catalogo."
                />
              }
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>

  <app-autore-dialog
    [visible]="dialogVisible()"
    (visibleChange)="onDialogVisibleChange($event)"
    [autore]="editing()"
    [nazionalita]="nazionalitaOptions.value() ?? []"
    [saving]="saving()"
    (save)="save($event)"
    (nazionalitaCreata)="onNazionalitaCreata()"
  />
</section>
